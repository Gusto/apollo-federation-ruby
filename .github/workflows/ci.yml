name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  BUNDLE_APP_CONFIG: .bundle

jobs:
  ruby-lint:
    name: Ruby Lint (Ruby ${{ matrix.ruby }})
    runs-on:
      group: gusto-ubuntu-default
    strategy:
      matrix:
        ruby: ['3.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

  ruby-test:
    name: Ruby Test (Ruby ${{ matrix.ruby }})
    runs-on:
      group: gusto-ubuntu-default
    strategy:
      matrix:
        ruby: ['3.2', '3.3', '3.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Show bundle config
        run: bundle config list

      - name: Run RSpec
        run: bundle exec rspec

  ruby-test-graphql-next:
    name: Ruby Test (graphql 2.6, Ruby ${{ matrix.ruby }})
    runs-on:
      group: gusto-ubuntu-default
    strategy:
      matrix:
        ruby: ['3.2', '3.3', '3.4']
    env:
      # The main Gemfile pins `graphql ~> 2.0.0`, under which GraphQL::Execution::Next doesn't
      # exist and the next_execution-tagged specs are gated out entirely. This Gemfile pins
      # graphql-ruby to the version that actually supports it, so those specs run for real.
      BUNDLE_GEMFILE: gemfiles/graphql_2.6.gemfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run RSpec (GraphQL::Execution::Next specs only)
        run: bundle exec rspec --tag next_execution

  integration-tests:
    name: Integration Tests (Ruby ${{ matrix.ruby }})
    runs-on:
      group: gusto-ubuntu-default
    strategy:
      matrix:
        ruby: ['3.2', '3.3', '3.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install yarn dependencies
        run: yarn install --frozen-lockfile

      - name: Run yarn tests
        run: bundle exec yarn test

      - name: Run yarn lint
        run: yarn lint

