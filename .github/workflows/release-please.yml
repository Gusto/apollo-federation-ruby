name: Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Release Please
    # TOKEN_APP_* are Environment secrets scoped to `release`, not repo secrets -- a job that
    # doesn't declare this environment sees them as unset, not as a permission error.
    environment: release
    runs-on:
      group: gusto-ubuntu-default
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      # release-please-action defaults to the built-in GITHUB_TOKEN, but GitHub does not run
      # other workflows (e.g. this repo's CI on pull_request) for anything a GITHUB_TOKEN
      # creates -- the release PR would sit with no status checks at all. A real GitHub App
      # token behaves like an external actor, so CI runs on the release PR normally.
      - name: Generate GitHub App token
        id: generate_token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ secrets.TOKEN_APP_ID }}
          installation_id: ${{ secrets.TOKEN_APP_INSTALLATION_ID }}
          private_key: ${{ secrets.TOKEN_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.generate_token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please only bumps version.rb and CHANGELOG.md; it has no Bundler awareness, so
      # Gemfile.lock -- which pins this repo's own path gemspec -- goes stale on every version
      # bump and fails CI under frozen mode. The old semantic-release job avoided this by
      # unfreezing Bundler and committing a regenerated lockfile alongside the version bump;
      # this replicates that directly onto the release PR's branch.
      - name: Checkout release PR
        if: steps.release.outputs.pr != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Set up Ruby
        if: steps.release.outputs.pr != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Update and commit Gemfile.lock
        if: steps.release.outputs.pr != ''
        run: |
          bundle config set --local frozen false
          bundle lock
          if ! git diff --quiet Gemfile.lock; then
            git config user.name "release-please[bot]"
            git config user.email "release-please[bot]@users.noreply.github.com"
            git add Gemfile.lock
            git commit -m "chore: update Gemfile.lock"
            git push
          fi

  publish:
    name: Publish Gem
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    # RUBYGEMS_API_KEY is also scoped to the `release` Environment (see the release-please job) --
    # missing this, GEM_HOST_API_KEY resolves empty and `gem push` fails with "Access Denied"
    # instead of an obvious permissions error.
    environment: release
    runs-on:
      group: gusto-ubuntu-default
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build and publish gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          gem build apollo-federation.gemspec
          gem push apollo-federation-*.gem

      - name: Upload gem to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ./apollo-federation-*.gem --clobber
